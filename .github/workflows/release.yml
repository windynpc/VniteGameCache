name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build release package
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./scripts/build-release.ps1 -Version $version

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $arguments = @(
            'release', 'create', '${{ github.ref_name }}',
            "release/VniteGameCache-v$version-win-x64.zip",
            "release/VniteGameCache-v$version-win-x64.zip.sha256",
            '--title', "Vnite Game Cache $version"
          )
          $notesPath = "docs/releases/$version.md"
          if (Test-Path -LiteralPath $notesPath) {
            $arguments += @('--notes-file', $notesPath)
          } else {
            $arguments += '--generate-notes'
          }
          if ($version.Contains('-')) {
            $arguments += '--prerelease'
          }
          gh @arguments
